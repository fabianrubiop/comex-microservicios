

networks:
  comex-network:
    driver: bridge

services:
  # Base de Datos Centralizada para todo el ecosistema
  mysql-comex:
    image: mysql:8.0
    container_name: mysql-comex
    environment:
      MYSQL_ROOT_PASSWORD: comexpassword
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    networks:
      - comex-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servidor de Descubrimiento (Eureka)
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - comex-network

  # Puerta de Entrada (API Gateway)
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    networks:
      - comex-network

  # Microservicio: Carga
  carga-ms:
    build: ./carga-ms
    container_name: carga-ms
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-comex:3306/carga_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: comexpassword
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://admin:comex123@eureka-server:8761/eureka/
    depends_on:
      mysql-comex:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - comex-network

  # Microservicio: Clasificación
  clasificacion-ms:
    build: ./clasificacion-ms
    container_name: clasificacion-ms
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-comex:3306/clasificacion_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: comexpassword
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://admin:comex123@eureka-server:8761/eureka/
    depends_on:
      mysql-comex:
        condition: service_healthy
    networks:
      - comex-network

  # Microservicio: Pagos
  pagos-ms:
    build: ./pagos-ms
    container_name: pagos-ms
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-comex:3306/pago_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: comexpassword
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://admin:comex123@eureka-server:8761/eureka/
    depends_on:
      mysql-comex:
        condition: service_healthy
    networks:
      - comex-network

  # Microservicio: Documentos
  documentos-ms:
    build: ./documentos-ms
    container_name: documentos-ms
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-comex:3306/documento_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: comexpassword
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://admin:comex123@eureka-server:8761/eureka/
    depends_on:
      mysql-comex:
        condition: service_healthy
    networks:
      - comex-network

  # Microservicio: Riesgo
  riesgo-ms:
    build: ./riesgo-ms
    container_name: riesgo-ms
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-comex:3306/riesgo_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: comexpassword
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://admin:comex123@eureka-server:8761/eureka/
    depends_on:
      mysql-comex:
        condition: service_healthy
    networks:
      - comex-network

  # Microservicio: Banco External Mock
  banco-ms:
    build: ./banco-ms
    container_name: banco-ms
    ports:
      - "8086:8086"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://admin:comex123@eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - comex-network

  # Microservicio: Notificaciones
  notificacion-ms:
    build: ./notificacion-ms
    container_name: notificacion-ms
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-comex:3306/notificacion_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: comexpassword
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://admin:comex123@eureka-server:8761/eureka/
    depends_on:
      mysql-comex:
        condition: service_healthy
    networks:
      - comex-network

volumes:
  mysql_data: