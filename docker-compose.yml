version: '3.8'

networks:
  comex-network:
    driver: bridge

services:
  # Base de Datos Centralizada para todo el ecosistema
  mysql-comex:
    image: mysql:8.0
    container_name: mysql-comex
    environment:
      MYSQL_ROOT_PASSWORD: comexpassword
      MYSQL_DATABASE: comex_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - comex-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root -pcomexpassword || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servidor de Descubrimiento (Eureka)
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - comex-network


  # Puerta de Entrada (API Gateway)
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    networks:
      - comex-network

  # Microservicio: Banco External Mock
  banco-ms:
    build: ./banco-ms
    container_name: banco-ms
    ports:
      - "8091:8091"
    environment:
    - SERVER_PORT=8091  # 👈 ESTA LÍNEA ES LA QUE OBLIGA AL JAR A USAR EL 8091
    - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-comex:3306/comex_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    - SPRING_DATASOURCE_USERNAME=root
    - SPRING_DATASOURCE_PASSWORD=comexpassword
    - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://admin:comex123@eureka-server:8761/eureka/
    - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true

    depends_on:
    - eureka-server
    - mysql-comex
    networks:
      - comex-network

  # Microservicio: Carga
  carga-ms:
    build: ./carga-ms
    container_name: carga-ms
    ports:
      - "8081:8081"  # 👈 Mapeo exacto 8081:8081 como pide su archivo de configuración interno
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-comex:3306/comex_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: comexpassword
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"  # 👈 Esto obliga a Flyway a saltarse cualquier traba de checksum
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://admin:comex123@eureka-server:8761/eureka/
    depends_on:
      mysql-comex:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - comex-network

  # Microservicio: Riesgo
  riesgo-ms:
    build: ./riesgo-ms
    container_name: riesgo-ms
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-comex:3306/comex_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: comexpassword
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://admin:comex123@eureka-server:8761/eureka/
    depends_on:
      mysql-comex:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - comex-network

  # Microservicio: Clasificación
  clasificacion-ms:
    build: ./clasificacion-ms
    container_name: clasificacion-ms
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-comex:3306/comex_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: comexpassword
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://admin:comex123@eureka-server:8761/eureka/
      SPRING_FLYWAY_IGNORE-FAILED-MIGRATION: "true"
      SPRING_FLYWAY_VALIDATE-ON-MIGRATE: "false"
    depends_on:
      mysql-comex:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - comex-network

  # Microservicio: Documentos
  documentos-ms:
    build: ./documentos-ms
    container_name: documentos-ms
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-comex:3306/comex_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: comexpassword
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://admin:comex123@eureka-server:8761/eureka/
    depends_on:
      mysql-comex:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - comex-network

  # Microservicio: Notificaciones
  notificacion-ms:
    build: ./notificacion-ms
    container_name: notificacion-ms
    ports:
      - "9086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-comex:3306/comex_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: comexpassword
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://admin:comex123@eureka-server:8761/eureka/
    depends_on:
      mysql-comex:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - comex-network

  # Microservicio: Pagos
  pagos-ms:
    build: ./pagos-ms
    container_name: pagos-ms
    ports:
      - "9087:8087"
    entrypoint: >
      sh -c "echo 'Esperando por MySQL...' &&
         while ! (echo > /dev/tcp/mysql-comex/3306) >/dev/null 2>&1; do
           sleep 5
         done;
         echo 'MySQL listo! Iniciando aplicación...' &&
         java -jar /app.jar"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-comex:3306/comex_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: comexpassword
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://admin:comex123@eureka-server:8761/eureka/
    depends_on:
      mysql-comex:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - comex-network

volumes:
  mysql_data: