spring.application.name=clasificacion-ms
server.port=8082

# Configuracion de Base de Datos
spring.datasource.url=jdbc:mysql://localhost:3306/clasificacion_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Desactivar Flyway temporalmente para que no choque con errores de tabla
spring.flyway.enabled=false

spring.flyway.repair-at-start=true
spring.flyway.baseline-on-migrate=true

spring.security.user.name=admin
spring.security.user.password=comex123